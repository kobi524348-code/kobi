<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>3日坊主になるのはなぜ？ スライド</title>
<style>
  :root {
    --bg: #fff8ec;
    --ink: #3b302a;
    --sub: #8a7a6e;
    --accent: #f28c28;
    --metan: #c9558a;
    --zunda: #5aa84a;
    --line: #ecdcc6;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "IPAPGothic", "IPAGothic", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  }
  .slide {
    display: none;
    position: relative;
    width: 1920px; height: 1080px;
    /* 下の240pxは字幕用にあけておく */
    padding: 110px 160px 240px;
    flex-direction: column; justify-content: center; align-items: center;
    text-align: center;
  }
  .slide.active { display: flex; }
  .slide::before {
    content: ""; position: absolute; left: 0; top: 0; right: 0; height: 28px;
    background: var(--accent);
  }
  .tag {
    position: absolute; top: 70px; left: 90px;
    font-size: 40px; font-weight: bold; color: #fff;
    background: var(--ink); border-radius: 999px; padding: 10px 36px;
  }
  .no { position: absolute; top: 76px; right: 96px; font-size: 40px; color: var(--sub); }
  .big { font-size: 150px; font-weight: bold; line-height: 1.25; letter-spacing: 0.02em; }
  .mid { font-size: 96px; font-weight: bold; line-height: 1.35; }
  .small { font-size: 56px; color: var(--sub); line-height: 1.5; }
  .accent { color: var(--accent); }
  .metan { color: var(--metan); }
  .zunda { color: var(--zunda); }
  .mt { margin-top: 56px; }

  /* 1 */
  .chips { display: flex; gap: 48px; margin-top: 70px; }
  .chip {
    font-size: 64px; font-weight: bold; background: #fff;
    border: 5px solid var(--line); border-radius: 28px; padding: 26px 56px;
  }
  .chip s { color: var(--sub); text-decoration-thickness: 6px; text-decoration-color: var(--accent); }

  /* 2 */
  .cross { display: inline-block; position: relative; color: var(--sub); }
  .cross::after {
    content: ""; position: absolute; left: -4%; right: -4%; top: 52%;
    height: 14px; background: var(--accent); transform: rotate(-4deg); border-radius: 7px;
  }

  /* 3 */
  .num { font-size: 300px; font-weight: bold; color: var(--accent); line-height: 1; }
  .num span { font-size: 130px; }
  .note { position: absolute; bottom: 260px; font-size: 36px; color: var(--sub); }

  /* 4 */
  .bar {
    position: relative; width: 1400px; height: 90px; margin-top: 90px;
    background: #fff; border: 5px solid var(--line); border-radius: 45px; overflow: hidden;
  }
  .bar .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 4.5%; background: var(--accent); }
  .bar-labels { width: 1400px; display: flex; justify-content: space-between; margin-top: 22px; font-size: 52px; font-weight: bold; }
  .marker { color: var(--accent); }

  /* 5 */
  .pill {
    display: inline-block; font-size: 110px; font-weight: bold; color: #fff;
    background: var(--zunda); border-radius: 36px; padding: 24px 70px;
  }
</style>
</head>
<body>

<!-- 1 導入 -->
<section class="slide" data-n="1">
  <div class="tag">導入</div><div class="no">1 / 6</div>
  <div class="big">3日坊主、<br>ありますか？</div>
  <div class="chips">
    <div class="chip"><s>日記</s></div>
    <div class="chip"><s>ランニング</s></div>
  </div>
</section>

<!-- 2 疑問 -->
<section class="slide" data-n="2">
  <div class="tag">疑問</div><div class="no">2 / 6</div>
  <div class="mid"><span class="cross">意志が弱いから</span></div>
  <div class="big mt">じゃあ、<span class="accent">なぜ？</span></div>
</section>

<!-- 3 解決：66日 -->
<section class="slide" data-n="3">
  <div class="tag">解決</div><div class="no">3 / 6</div>
  <div class="mid">習慣になるまで 平均</div>
  <div class="num">66<span>日</span></div>
  <div class="mid mt" style="font-size:72px">人によって <span class="accent">18日〜254日</span></div>
  <div class="note">ロンドン大学の研究（参加者96人）より</div>
</section>

<!-- 4 解決：3日目はまだ途中 -->
<section class="slide" data-n="4">
  <div class="tag">解決</div><div class="no">4 / 6</div>
  <div class="big">3日目は、<br><span class="accent">まだ途中</span></div>
  <div class="bar"><div class="fill"></div></div>
  <div class="bar-labels"><span class="marker">▲ 3日目</span><span>66日</span></div>
</section>

<!-- 5 コツ -->
<section class="slide" data-n="5">
  <div class="tag">コツ</div><div class="no">5 / 6</div>
  <div class="mid">やめられないほど<br><span class="accent">小さく</span>する</div>
  <div class="mt"><span class="pill">1日1行・1分</span></div>
</section>

<!-- 6 まとめ -->
<section class="slide" data-n="6">
  <div class="tag">まとめ</div><div class="no">6 / 6</div>
  <div class="mid">66日続けるつもりで</div>
  <div class="big mt">今日は<span class="accent">1分</span>だけ</div>
</section>

<script>
  var n = (location.hash || "#1").slice(1);
  var el = document.querySelector('.slide[data-n="' + n + '"]') || document.querySelector('.slide');
  el.classList.add('active');
</script>
</body>
</html>
